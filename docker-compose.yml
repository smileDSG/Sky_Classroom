services:
  sky_classroom:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      # LibreOffice is bundled in the Docker image.
      # Override only if you use a custom LO build.
      - LO_SOFFICE_PATH=/usr/bin/soffice
    # 演示数据已打包进镜像的 /app/data，请勿把卷挂到 /app/data 以免遮蔽。
    # 如需持久化用户数据，请改用 MySQL/Supabase，或把卷挂到其它路径（如 /app/data/uploads）。
    # volumes:
    #   - sky_classroom-data:/app/data
    restart: unless-stopped
