<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 160" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="70" cy="80" r="60" fill="url(#skyGrad)" opacity="0.1"/>

  <!-- Open book / classroom -->
  <g transform="translate(20, 55)">
    <!-- Book left page -->
    <path d="M50 50 C35 45, 10 42, 5 40 L5 15 C10 17, 35 20, 50 25 Z" fill="url(#skyGrad)" opacity="0.9"/>
    <!-- Book right page -->
    <path d="M50 50 C65 45, 90 42, 95 40 L95 15 C90 17, 65 20, 50 25 Z" fill="url(#skyGrad)" opacity="0.7"/>
    <!-- Book spine line -->
    <line x1="50" y1="25" x2="50" y2="50" stroke="#0369a1" stroke-width="1.5" opacity="0.4"/>
    <!-- Book page lines left -->
    <line x1="15" y1="24" x2="45" y2="28" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="18" y1="30" x2="46" y2="33" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <line x1="20" y1="36" x2="47" y2="38" stroke="#fff" stroke-width="1" opacity="0.3"/>
    <!-- Book page lines right -->
    <line x1="55" y1="28" x2="85" y2="24" stroke="#fff" stroke-width="1" opacity="0.5"/>
    <line x1="54" y1="33" x2="82" y2="30" stroke="#fff" stroke-width="1" opacity="0.4"/>
    <line x1="53" y1="38" x2="80" y2="36" stroke="#fff" stroke-width="1" opacity="0.3"/>
  </g>

  <!-- Clouds rising from the book -->
  <g transform="translate(25, 20)">
    <!-- Main cloud -->
    <ellipse cx="45" cy="30" rx="22" ry="12" fill="url(#cloudGrad)"/>
    <ellipse cx="30" cy="32" rx="14" ry="10" fill="url(#cloudGrad)"/>
    <ellipse cx="60" cy="32" rx="14" ry="10" fill="url(#cloudGrad)"/>
    <ellipse cx="45" cy="35" rx="25" ry="8" fill="url(#cloudGrad)"/>
    <!-- Small cloud left -->
    <ellipse cx="8" cy="42" rx="10" ry="6" fill="#c7d2fe" opacity="0.6"/>
    <ellipse cx="0" cy="44" rx="7" ry="5" fill="#c7d2fe" opacity="0.6"/>
    <!-- Small cloud right -->
    <ellipse cx="82" cy="42" rx="10" ry="6" fill="#c7d2fe" opacity="0.6"/>
    <ellipse cx="90" cy="44" rx="7" ry="5" fill="#c7d2fe" opacity="0.6"/>
  </g>

  <!-- Sun / Knowledge star above -->
  <g transform="translate(70, 18)">
    <circle cx="0" cy="0" r="10" fill="url(#sunGrad)"/>
    <!-- Sun rays -->
    <line x1="0" y1="-14" x2="0" y2="-18" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="10" y1="-10" x2="13" y2="-13" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-10" y1="-10" x2="-13" y2="-13" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="14" y1="0" x2="18" y2="0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <line x1="-14" y1="0" x2="-18" y2="0" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <!-- Lightbulb glow -->
    <circle cx="0" cy="0" r="6" fill="#fff" opacity="0.3"/>
  </g>

  <!-- Sparkles / knowledge particles -->
  <circle cx="38" cy="15" r="1.5" fill="#fbbf24" opacity="0.6"/>
  <circle cx="100" cy="25" r="1" fill="#38bdf8" opacity="0.5"/>
  <circle cx="20" cy="28" r="1.2" fill="#0ea5e9" opacity="0.4"/>

  <!-- Text: sky classroom -->
  <text x="145" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="700" fill="url(#textGrad)" letter-spacing="-0.5">
    sky
  </text>
  <text x="200" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="300" fill="#3b82f6" letter-spacing="1">
    classroom
  </text>

  <!-- Tagline -->
  <text x="147" y="96" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" fill="#0284c7" opacity="0.6" letter-spacing="3">
    AI · 学习 · 无限可能
  </text>

  <!-- Subtle underline decoration -->
  <rect x="145" y="78" width="120" height="1.5" rx="1" fill="url(#skyGrad)" opacity="0.2"/>
</svg>
